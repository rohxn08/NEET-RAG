services:

  # ── 1. Vector store ────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neet_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      disable: true
    restart: unless-stopped

  # ── 2. One-time index builder (runs then exits) ────────────────
  ingest:
    build: .
    container_name: neet_ingest
    command: sh -c "sleep 10 && python ingest.py"
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=http://172.18.0.1:11434
      - OLLAMA_BASE_URL=http://172.18.0.1:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    restart: "no"

  # ── 3. Streamlit app ───────────────────────────────────────────
  app:
    build: .
    container_name: neet_app
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - ingest
    ports:
      - "8501:8501"
    environment:
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=http://172.18.0.1:11434
      - OLLAMA_BASE_URL=http://172.18.0.1:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    restart: unless-stopped
